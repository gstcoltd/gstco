<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الاختيار العالمي - نظام إدارة الأسطول والرحلات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-luxury-light { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-luxury-light min-h-screen text-slate-800 antialiased selection:bg-amber-400 selection:text-slate-900">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden p-4">
        <div class="absolute inset-0 z-0 opacity-25 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop');"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/80 to-slate-900/60 z-0"></div>

        <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 border border-amber-200/30 z-10 relative">
            <div class="text-center mb-6 sm:mb-8">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 sm:mb-4 border-2 border-amber-400 shadow-xl">
                    <i class="fa-solid fa-truck-front text-amber-400 text-2xl sm:text-3xl"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">شركة الاختيار العالمي</h2>
                <p class="text-amber-600 font-semibold text-[10px] sm:text-xs tracking-wider uppercase mt-1">Global Choice Company</p>
                <p class="text-gray-400 text-xs mt-1">نظام متابعة أسطول الشاحنات والرحلات اللوجستية</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
                            <i class="fa-solid fa-user-shield"></i>
                        </span>
                        <input type="text" id="username" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm transition" placeholder="أدخل اسم المستخدم">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-slate-700">كلمة المرور</label>
                        <button type="button" onclick="openForgotPasswordModal()" class="text-[11px] font-bold text-amber-600 hover:underline">نسيت كلمة المرور؟</button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm transition" placeholder="أدخل كلمة المرور">
                    </div>
                </div>
                <div id="loginError" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2.5 rounded-xl border border-rose-200">
                    اسم المستخدم أو كلمة المرور غير صحيحة
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-3.5 px-4 rounded-xl shadow-lg border border-amber-400/30 transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
                <span>الحساب الرئيسي: <strong class="text-slate-700">admin / admin123</strong></span>
            </div>
        </div>
    </div>

    <!-- نافذة استعادة كلمة المرور Modal -->
    <div id="forgotPasswordModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-900 mb-2">استعادة كلمة المرور</h3>
            <p class="text-xs text-slate-500 mb-4">أدخل الرمز الرئيسي لاستعادة كلمة مرور الحساب وإعادتها للوضع الافتراضي</p>
            <form onsubmit="handleResetPassword(event)" class="space-y-4">
                <div><input type="text" id="resetUsername" value="admin" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs" placeholder="اسم المستخدم"></div>
                <div><input type="password" id="resetMasterCode" placeholder="أدخل الرمز الرئيسي (123456)" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs"></div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeForgotPasswordModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-slate-900 text-amber-400 font-bold rounded-xl text-xs">استعادة كلمة المرور</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://global-choice-fleet-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let users = [];

        db.ref('fleetData').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val && val.users) {
                users = val.users;
            } else {
                users = [{ id: 1, username: 'admin', password: 'admin123', fullName: 'أبو سعيد (المدير)', role: 'admin' }];
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            
            const found = users.find(x => x.username === u && x.password === p);
            if (found) {
                alert('تم تسجيل الدخول بنجاح!');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function openForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.remove('hidden');
        }
        function closeForgotPasswordModal() { 
            document.getElementById('forgotPasswordModal').classList.add('hidden'); 
        }

        function handleResetPassword(e) {
            e.preventDefault();
            const u = document.getElementById('resetUsername').value.trim();
            const code = document.getElementById('resetMasterCode').value.trim();
            
            if (code === '123456') {
                let targetUser = users.find(x => x.username === u);
                if (targetUser) {
                    targetUser.password = 'admin123';
                    db.ref('fleetData/users').set(users);
                    alert('تم إعادة كلمة المرور إلى admin123 بنجاح!');
                    closeForgotPasswordModal();
                } else {
                    alert('المستخدم غير موجود!');
                }
            } else {
                alert('الرمز الرئيسي غير صحيح!');
            }
        }
    </script>
</body>
</html>
