<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الاختيار العالمي للنقليات - نظام إدارة الأسطول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-slate-900">شركة الاختيار العالمي للنقليات</h2>
                <p class="text-amber-600 text-xs font-bold mt-1">نظام إدارة الأسطول (Supabase SQL)</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs" placeholder="أدخل اسم المستخدم">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full p-3 bg-slate-50 border rounded-xl text-xs" placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-amber-400 font-bold py-3 rounded-xl text-xs shadow-lg">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="mainDashboard" class="hidden min-h-screen flex flex-col lg:flex-row">
        <aside class="w-full lg:w-72 bg-slate-900 text-white p-6 flex flex-col justify-between">
            <div>
                <h2 class="font-black text-sm text-amber-400 mb-6">الاختيار العالمي للنقليات</h2>
                <nav class="space-y-2">
                    <button onclick="switchTab('dashboard')" class="w-full text-right p-3 rounded-xl text-xs font-bold hover:bg-slate-800 text-amber-400">الرئيسية</button>
                    <button onclick="switchTab('trucks')" class="w-full text-right p-3 rounded-xl text-xs font-bold hover:bg-slate-800">الشاحنات</button>
                    <button onclick="switchTab('trips')" class="w-full text-right p-3 rounded-xl text-xs font-bold hover:bg-slate-800">الرحلات</button>
                </nav>
            </div>
            <button onclick="handleLogout()" class="bg-rose-600 text-white p-2.5 rounded-xl text-xs font-bold">تسجيل خروج</button>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto">
            <!-- قسم الرئيسية -->
            <section id="sec-dashboard" class="space-y-6">
                <h1 class="text-xl font-black">لوحة التحكم الرئيسية</h1>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm">
                        <span class="text-xs text-slate-500 font-bold">الشاحنات المسجلة</span>
                        <div id="stat-trucks" class="text-2xl font-black mt-2">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm">
                        <span class="text-xs text-slate-500 font-bold">الرحلات</span>
                        <div id="stat-trips" class="text-2xl font-black mt-2 text-sky-600">0</div>
                    </div>
                </div>
            </section>
            
            <!-- قسم الشاحنات -->
            <section id="sec-trucks" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
                    <h2 class="font-bold text-sm">إدارة الشاحنات (اللوحات بحروف وأرقام)</h2>
                    <button onclick="addTruck()" class="bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-xl">إضافة شاحنة جديدة</button>
                </div>
                <div id="trucks-list" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
            </section>

            <!-- قسم الرحلات -->
            <section id="sec-trips" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
                    <h2 class="font-bold text-sm">سجل الرحلات</h2>
                    <button onclick="addTrip()" class="bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-xl">تسجيل رحلة جديدة</button>
                </div>
                <div id="trips-list" class="space-y-2"></div>
            </section>
        </main>
    </div>

    <script>
        // إعدادات الاتصال بمشروع Supabase الخاص بك
        const SUPABASE_URL = 'https://hmttwtlaeczvfjozsama.supabase.co';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_ الخاص_بك_هنا'; // انسخ مفتاح الـ anon العام من إعدادات Supabase لديك
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let trucks = [];
        let trips = [];

        async function initApp() {
            await loadFromSupabase();
            renderData();
        }

        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            initApp();
        }

        function handleLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function switchTab(tab) {
            document.getElementById('sec-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('sec-trucks').classList.toggle('hidden', tab !== 'trucks');
            document.getElementById('sec-trips').classList.toggle('hidden', tab !== 'trips');
        }

        async function loadFromSupabase() {
            const { data, error } = await client.from('fleet_data').select('*').eq('data_key', 'main_store').single();
            if (data && data.payload) {
                trucks = data.payload.trucks || [];
                trips = data.payload.trips || [];
            }
        }

        async function syncToSupabase() {
            const { error } = await client
                .from('fleet_data')
                .upsert({ data_key: 'main_store', payload: { trucks, trips } }, { onConflict: 'data_key' });
            if(error) console.error('خطأ في المزامنة:', error.message);
        }

        function addTruck() {
            const plateInput = prompt('أدخل رقم اللوحة (حروف وأرقام، مثل: أ ب ج 2841):');
            if(plateInput) {
                trucks.push({ id: Date.now(), plate: plateInput, model: 'شاحنة نقل', status: 'جاهزة' });
                syncToSupabase();
                renderData();
            }
        }

        function addTrip() {
            const route = prompt('أدخل مسار الرحلة (مثلاً: جدة - الرياض):');
            if(route) {
                trips.push({ id: Date.now(), route: route, status: 'نشطة' });
                syncToSupabase();
                renderData();
            }
        }

        function renderData() {
            document.getElementById('stat-trucks').innerText = trucks.length;
            document.getElementById('stat-trips').innerText = trips.length;
            
            document.getElementById('trucks-list').innerHTML = trucks.map(t => `
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <div class="font-black text-slate-900 text-sm">رقم اللوحة: ${t.plate}</div>
                    <div class="text-xs text-slate-500 mt-1">الحالة: ${t.status}</div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">لا توجد شاحنات مضافة بعد</p>';

            document.getElementById('trips-list').innerHTML = trips.map(tr => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                    <div>
                        <div class="font-bold text-xs text-slate-900">المسار: ${tr.route}</div>
                        <div class="text-[10px] text-slate-500 mt-0.5">الحالة: ${tr.status}</div>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">لا توجد رحلات مسجلة بعد</p>';
        }
    </script>
</body>
</html>
