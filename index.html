<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الاختيار العالمي للنقليات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-amber-400/30">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border-2 border-amber-400 shadow-lg">
                <i class="fa-solid fa-truck-front text-amber-400 text-2xl"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900">شركة الاختيار العالمي للنقليات</h2>
            <p class="text-xs text-amber-600 font-bold mt-1">تسجيل الدخول المباشر</p>
        </div>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم</label>
                <input type="text" id="username" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm" placeholder="أدخل اسم المستخدم (admin)">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm" placeholder="أدخل كلمة المرور (admin123)">
            </div>
            <div id="loginError" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2.5 rounded-xl border border-rose-200">
                خطأ في اسم المستخدم أو كلمة المرور
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-3.5 rounded-xl shadow-lg transition">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <!-- لوحة التحكم البسيطة للتأكد من عمل النظام -->
    <div id="mainDashboard" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-8 text-center space-y-6">
        <h1 class="text-2xl font-black text-slate-900">مرحباً بك يا أبو سعيد في النظام</h1>
        <p class="text-emerald-600 font-bold">تم تسجيل الدخول بنجاح والاتصال بقاعدة البيانات سليم 100%!</p>
        <button onclick="handleLogout()" class="px-6 py-3 bg-rose-600 text-white font-bold rounded-xl text-xs">تسجيل خروج</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://hmttwtlaeczvfjozsama.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtdHR3dGxhZWN6dmZqb3pzYW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTU5NjIsImV4cCI6MjEwNTczMTk2Mn0.0-M1LVkNnbVSbUeYX_RueqUUcHNRbCtipCn5nGSuVNc';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            // استعلام مباشر من جدول app_users في سحابة Supabase
            const { data, error } = await client
                .from('app_users')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .maybeSingle();

            if (data) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
