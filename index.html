<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الاختيار العالمي - نظام إدارة الأسطول والرحلات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-luxury-light { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-luxury-light min-h-screen text-slate-800 antialiased selection:bg-amber-400 selection:text-slate-900">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden p-4">
        <div class="absolute inset-0 z-0 opacity-25 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop');"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/80 to-slate-900/60 z-0"></div>

        <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 border border-amber-200/30 z-10 relative">
            <div class="text-center mb-6 sm:mb-8">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 sm:mb-4 border-2 border-amber-400 shadow-xl">
                    <i class="fa-solid fa-truck-front text-amber-400 text-2xl sm:text-3xl"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">شركة الاختيار العالمي</h2>
                <p class="text-amber-600 font-semibold text-[10px] sm:text-xs tracking-wider uppercase mt-1">Global Choice Company</p>
                <p class="text-gray-400 text-xs mt-1">نظام متابعة أسطول الشاحنات والرحلات اللوجستية</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
                            <i class="fa-solid fa-user-shield"></i>
                        </span>
                        <input type="text" id="username" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm transition" placeholder="أدخل اسم المستخدم">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm transition" placeholder="أدخل كلمة المرور">
                    </div>
                </div>
                <div id="loginError" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2.5 rounded-xl border border-rose-200">
                    اسم المستخدم أو كلمة المرور غير صحيحة
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-3.5 px-4 rounded-xl shadow-lg border border-amber-400/30 transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 flex flex-col gap-2 text-center text-xs">
                <button type="button" onclick="forceFixAdminAccount()" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-800 font-bold py-2.5 px-3 rounded-xl border border-amber-300 transition">
                    ⚡ إصلاح وتعيين حساب الآدمن مجدداً (admin / admin123)
                </button>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="mainDashboard" class="hidden min-h-screen flex flex-col lg:flex-row">
        <!-- الشريط الجانبي Sidebar -->
        <aside class="w-full lg:w-72 bg-slate-900 text-white flex-shrink-0 flex flex-col justify-between shadow-2xl z-20">
            <div>
                <div class="p-4 sm:p-6 border-b border-slate-800/80 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-500/10 border border-amber-400/40 rounded-xl flex items-center justify-center text-amber-400">
                            <i class="fa-solid fa-truck-fast text-lg"></i>
                        </div>
                        <div>
                            <h2 class="font-black text-xs sm:text-sm text-white leading-snug">الاختيار العالمي</h2>
                            <span class="text-[9px] sm:text-[10px] text-amber-400 font-semibold tracking-wider">GLOBAL CHOICE CO.</span>
                        </div>
                    </div>
                </div>

                <nav class="p-2 sm:p-4 grid grid-cols-3 lg:grid-cols-1 gap-1 sm:gap-1.5">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex flex-col lg:flex-row items-center gap-1.5 lg:gap-3 p-2.5 lg:px-4 lg:py-3 rounded-xl text-[11px] lg:text-xs font-bold text-slate-300 hover:bg-slate-800 transition text-center lg:text-right">
                        <i class="fa-solid fa-chart-pie text-amber-400 text-base lg:text-sm"></i> <span>الرئيسية</span>
                    </button>
                    <button onclick="switchTab('trips')" id="nav-trips" class="w-full flex flex-col lg:flex-row items-center gap-1.5 lg:gap-3 p-2.5 lg:px-4 lg:py-3 rounded-xl text-[11px] lg:text-xs font-bold text-slate-300 hover:bg-slate-800 transition text-center lg:text-right">
                        <i class="fa-solid fa-route text-sky-400 text-base lg:text-sm"></i> <span>الرحلات</span>
                    </button>
                    <button onclick="switchTab('trucks')" id="nav-trucks" class="w-full flex flex-col lg:flex-row items-center gap-1.5 lg:gap-3 p-2.5 lg:px-4 lg:py-3 rounded-xl text-[11px] lg:text-xs font-bold text-slate-300 hover:bg-slate-800 transition text-center lg:text-right">
                        <i class="fa-solid fa-truck text-indigo-400 text-base lg:text-sm"></i> <span>الشاحنات</span>
                    </button>
                    <button onclick="switchTab('drivers')" id="nav-drivers" class="w-full flex flex-col lg:flex-row items-center gap-1.5 lg:gap-3 p-2.5 lg:px-4 lg:py-3 rounded-xl text-[11px] lg:text-xs font-bold text-slate-300 hover:bg-slate-800 transition text-center lg:text-right">
                        <i class="fa-solid fa-user-gear text-purple-400 text-base lg:text-sm"></i> <span>السائقون</span>
                    </button>
                </nav>
            </div>

            <div class="p-3 sm:p-4 border-t border-slate-800/80 space-y-2">
                <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-xl transition text-[11px] font-bold shadow-md">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 overflow-y-auto max-h-screen bg-slate-50/50 p-6">
            <h1 class="text-2xl font-black text-slate-900 mb-4">لوحة تحكم الأسطول والرحلات</h1>
            <p class="text-sm text-slate-600">أهلاً بك أبا سعيد، تم تسجيل الدخول بنجاح إلى النظام.</p>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://global-choice-fleet-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let users = [];
        let trucks = [];
        let drivers = [];
        let trips = [];

        // الاستماع المباشر للسحابة
        db.ref('fleetData').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val && val.users) {
                users = val.users;
                trucks = val.trucks || [];
                drivers = val.drivers || [];
                trips = val.trips || [];
            } else {
                forceFixAdminAccount();
            }
        });

        // دالة الإصلاح الإجباري لحساب الآدمن
        function forceFixAdminAccount() {
            users = [ { id: 1, username: 'admin', password: 'admin123', fullName: 'أبو سعيد (المدير)', role: 'admin' } ];
            if (trucks.length === 0) {
                trucks = [
                    { id: 101, plate: '2841', model: 'مرسيدس أكتروس', status: 'ready' },
                    { id: 102, plate: '5912', model: 'فولفو FH', status: 'ready' }
                ];
            }
            if (drivers.length === 0) {
                drivers = [
                    { id: 1, name: 'محمد علي', phone: '0501234567', status: 'available', truckId: 101 },
                    { id: 2, name: 'أحمد سعيد', phone: '0559876543', status: 'available', truckId: 102 }
                ];
            }

            db.ref('fleetData').set({
                users: users,
                trucks: trucks,
                drivers: drivers,
                trips: trips,
                nextTripNumber: 1001
            }).then(() => {
                alert('تم إنشاء وإصلاح حساب الآدمن بنجاح!\n\nاسم المستخدم: admin\nكلمة المرور: admin123');
                document.getElementById('username').value = 'admin';
                document.getElementById('password').value = 'admin123';
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            
            const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
            if (found) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function switchTab(tab) {
            // التنقل البسيط
        }
    </script>
</body>
</html>
