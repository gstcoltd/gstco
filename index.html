<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الاختيار العالمي للنقليات - إدارة الشاحنات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-amber-400/30">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border-2 border-amber-400 shadow-lg">
                <i class="fa-solid fa-truck-front text-amber-400 text-2xl"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900">شركة الاختيار العالمي للنقليات</h2>
            <p class="text-xs text-amber-600 font-bold mt-1">نظام إدارة الأسطول</p>
        </div>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم</label>
                <input type="text" id="username" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-sm" placeholder="admin123">
            </div>
            <div id="loginError" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2.5 rounded-xl border border-rose-200">
                خطأ في اسم المستخدم أو كلمة المرور
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-3.5 rounded-xl shadow-lg transition">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <!-- لوحة التحكم الاحترافية لشاشة الشاحنات -->
    <div id="mainDashboard" class="hidden max-w-5xl w-full bg-slate-50 rounded-3xl shadow-2xl overflow-hidden border border-slate-700 min-h-[85vh] flex flex-col">
        <header class="bg-slate-900 p-4 text-white flex justify-between items-center border-b border-amber-400/30">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center text-slate-900 font-black">
                    <i class="fa-solid fa-truck"></i>
                </div>
                <div>
                    <h1 class="font-black text-sm">إدارة أسطول الشاحنات</h1>
                    <p class="text-[10px] text-amber-400">شركة الاختيار العالمي للنقليات</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs transition">
                <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
            </button>
        </header>

        <main class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow">
            <!-- نموذج إضافة شاحنة -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h3 class="font-bold text-slate-900 text-sm mb-4 flex items-center"><i class="fa-solid fa-circle-plus text-amber-500 ml-2"></i> إضافة شاحنة جديدة</h3>
                <form onsubmit="addTruck(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">رقم اللوحة (أحرف وأرقام)</label>
                        <input type="text" id="truckPlate" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" placeholder="مثال: أ ب ج 2841">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">الموديل / المواصفات</label>
                        <input type="text" id="truckModel" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" placeholder="مثال: مرسيدس أكتروس">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">حالة الشاحنة</label>
                        <select id="truckStatus" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                            <option value="جاهزة للعمل">جاهزة للعمل</option>
                            <option value="في رحلة">في رحلة</option>
                            <option value="في الصيانة">في الصيانة</option>
                            <option value="عطلانة">عطلانة</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-xl text-xs shadow transition">حفظ وإضافة الشاحنة</button>
                </form>
            </div>

            <!-- جدول عرض وإدارة الشاحنات -->
            <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center"><i class="fa-solid fa-truck-moving text-amber-500 ml-2"></i> الشاحنات المسجلة في الأسطول</h3>
                    <button onclick="loadTrucks()" class="text-xs text-amber-600 font-bold hover:underline"><i class="fa-solid fa-rotate ml-1"></i> تحديث القائمة</button>
                </div>
                <div class="overflow-x-auto flex-grow">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-100 text-slate-700">
                            <tr>
                                <th class="p-3 rounded-r-xl">رقم اللوحة</th>
                                <th class="p-3">الموديل</th>
                                <th class="p-3">الحالة</th>
                                <th class="p-3 rounded-l-xl text-center">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="trucksTable" class="divide-y divide-slate-100 text-slate-600">
                            <tr><td colspan="4" class="text-center p-6 text-slate-400">جاري تحميل الشاحنات...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://hmttwtlaeczvfjozsama.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtdHR3dGxhZWN6dmZqb3pzYW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTU5NjIsImV4cCI6MjEwNTczMTk2Mn0.0-M1LVkNnbVSbUeYX_RueqUUcHNRbCtipCn5nGSuVNc';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            const { data, error } = await client
                .from('app_users')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .maybeSingle();

            if (data) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                loadTrucks();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function loadTrucks() {
            const { data: trucks, error } = await client.from('trucks').select('*').order('id', { ascending: false });
            const table = document.getElementById('trucksTable');
            
            if (trucks && trucks.length > 0) {
                table.innerHTML = trucks.map(tr => {
                    let badgeColor = 'bg-emerald-100 text-emerald-800';
                    if (tr.status === 'في رحلة') badgeColor = 'bg-blue-100 text-blue-800';
                    if (tr.status === 'في الصيانة') badgeColor = 'bg-amber-100 text-amber-800';
                    if (tr.status === 'عطلانة') badgeColor = 'bg-rose-100 text-rose-800';

                    return `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-black text-slate-900">${tr.plate}</td>
                            <td class="p-3 text-slate-600">${tr.model || '---'}</td>
                            <td class="p-3"><span class="${badgeColor} px-2.5 py-1 rounded-full text-[10px] font-bold">${tr.status}</span></td>
                            <td class="p-3 text-center">
                                <button onclick="deleteTruck(${tr.id})" class="text-rose-500 hover:text-rose-700 font-bold p-1"><i class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } else {
                table.innerHTML = `<tr><td colspan="4" class="text-center p-6 text-slate-400">لا توجد شاحنات مسجلة حالياً</td></tr>`;
            }
        }

        async function addTruck(e) {
            e.preventDefault();
            const plate = document.getElementById('truckPlate').value.trim();
            const model = document.getElementById('truckModel').value.trim();
            const status = document.getElementById('truckStatus').value;

            const { error } = await client.from('trucks').insert([{ plate, model, status }]);
            if (!error) {
                alert('تمت إضافة الشاحنة بنجاح!');
                e.target.reset();
                loadTrucks();
            } else {
                alert('خطأ: رقم اللوحة موجود مسبقاً أو حدث مشكلة في الحفظ.');
            }
        }

        async function deleteTruck(id) {
            if (confirm('هل أنت متأكد من حذف هذه الشاحنة؟')) {
                const { error } = await client.from('trucks').delete().eq('id', id);
                if (!error) {
                    loadTrucks();
                } else {
                    alert('تعذر حذف الشاحنة.');
                }
            }
        }

        function handleLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
